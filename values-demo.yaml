# Live "demo" environment overrides for the cubefin-iam chart.
# Recovered from the deployed Helm release (iam-demo namespace) since this
# file didn't previously exist anywhere in the repo -- keep it here from now
# on so a redeploy doesn't silently drop these values back to the chart's
# auth.example.com / idp.example.com placeholders.
console:
  ingress:
    host: "iam.demo.cubefin.io"

dex:
  ingress:
    host: "idp.demo.cubefin.io"
  issuer: "https://idp.demo.cubefin.io"
  staticClient:
    redirectURIs:
      - "https://iam.demo.cubefin.io"
      # Allows the console's local dev server (npm run dev) to authenticate
      # against this live demo Dex instance. Remove if that's no longer needed.
      - "http://localhost:3000"
  # Full replacement list (Helm replaces, not merges, list values) -- the
  # chart's own 2 defaults (demo/viewer) plus 10 org-chart demo accounts so
  # the live demo shows a populated Users/Groups tree instead of one lonely
  # admin. All 10 share one password; see charts/cubefin-iam/README.md's
  # "라이브 데모" section for the account table. userID must stay in sync with
  # the FGA seed script's Dex-sub precomputation (see fga/seed_demo_data.sh
  # in the iam repo) -- changing a userID here without re-running that script
  # breaks the login <-> FGA-graph identity link.
  demoUsers:
    - email: "demo@cubefin.io"
      username: "demo"
      password: "cubefin-demo"
      hash: "$2b$12$KhXPTJLbmOKIVRahnKJOFO9zcHe.gck5l/jOxPyAN21bQNP8ACoce"
      userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
      # ^ log in with this one first — see the TOFU note in the chart README.
    - email: "viewer@cubefin.io"
