apiVersion: v2
name: cubefin-iam
description: CubeFin IAM — fine-grained ReBAC authorization engine (Edge + FGA + Console + Age + Dex)
type: application
version: 0.3.2
appVersion: "1.0.0"
home: https://www.cubefin.io
sources:
  - https://github.com/cubefin/helm-charts
keywords:
  - authorization
  - rebac
  - fine-grained-authorization
  - iam
  - oidc
  - graph-database
maintainers:
  - name: CubeFin
    url: https://www.cubefin.io
dependencies:
  - name: age
    version: 0.1.0
    repository: "file://./charts/age"
  - name: edge
    version: 0.1.0
    repository: "file://./charts/edge"
  - name: fga
    version: 0.1.0
    repository: "file://./charts/fga"
  - name: console
    version: 0.1.0
    repository: "file://./charts/console"
  - name: dex
    version: 0.1.0
    repository: "file://./charts/dex"
    condition: dex.enabled
