{{- if .Values.global.registryCredentials.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.registryCredentials.name }}
  labels:
    {{- include "auth.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" .Values.global.registryCredentials.registry .Values.global.registryCredentials.username .Values.global.registryCredentials.password (printf "%s:%s" .Values.global.registryCredentials.username .Values.global.registryCredentials.password | b64enc) | b64enc }}
{{- end }}
