apiVersion: v1
kind: Service
metadata:
  name: {{ include "age.fullname" . }}
  labels:
    {{- include "age.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "age.selectorLabels" . | nindent 4 }}
