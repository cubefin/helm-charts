apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "age.fullname" . }}-init-scripts
  labels:
    {{- include "age.labels" . | nindent 4 }}
data:
  00-init-age.sql: |
    CREATE EXTENSION IF NOT EXISTS age;
    LOAD 'age';
    SET search_path = ag_catalog, "$user", public;
  01-audit-schema.sql: |
    CREATE TABLE IF NOT EXISTS audit_logs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        timestamp TIMESTAMP NOT NULL,
        trace_id TEXT,
        user_id TEXT,
        username TEXT,
        user_email TEXT,
        client_ip TEXT,
        method TEXT,
        path TEXT,
        service_name TEXT,
        action TEXT,
        resource TEXT,
        authorized BOOLEAN,
        status_code INTEGER,
        duration_ms BIGINT,
        error_message TEXT
    );
